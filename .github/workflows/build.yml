name: Build IPK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPK
        run: |
          chmod +x scripts/build-ipk.sh
          ./scripts/build-ipk.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wled-fix-ipk
          path: dist/*.ipk
