name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Build IPK with ares-package
        run: |
          chmod +x scripts/build-ipk.sh
          ./scripts/build-ipk.sh

      - name: Generate Homebrew repo feed
        run: |
          python3 scripts/generate-repo.py "$GITHUB_REF_NAME" dist/*.ipk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.ipk
            dist/repo.json
