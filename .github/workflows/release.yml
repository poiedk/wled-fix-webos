name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release-v1.0.1]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build IPK
        run: |
          chmod +x scripts/build-ipk.sh
          ./scripts/build-ipk.sh

      - name: Generate Homebrew repo feed
        run: |
          python3 scripts/generate-repo.py "${{ steps.meta.outputs.tag }}" dist/*.ipk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.ipk
            dist/repo.json
